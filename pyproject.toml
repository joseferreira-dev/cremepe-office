[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cremepe-office"
version = "1.0.0"
description = "Backend Flask do CREMEPE Office: API REST para manipulacao de arquivos, PDFs, Word e Excel."
readme = "README.md"
requires-python = ">=3.9"
# Fonte unica de dependencias (arquivo unico no lugar de requirements.txt).
# Versoes pinadas para reproduzir exatamente o ambiente testado.
dependencies = [
    "Flask==3.1.3",
    "flask-cors==6.0.5",
    "PyPDF2==3.0.1",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "reportlab==5.1.2",
    "Pillow==13.0.0",
    "mutagen==1.48.1",
    "py7zr==1.1.4",
    "rarfile==4.5",
    "pyzipper==0.4.0",
    "cryptography==50.0.2",
    "pywin32==312; sys_platform == 'win32'",
    "docxcompose==2.2.0",
    "html2text==2025.4.15",
    "xlwt==1.3.0",
    "pdf2docx==0.5.13",
    "PyMuPDF==2.2",
    "pikepdf==10.18.2",
    # OCR (item10): esta lib e APENAS o puente Python - o binario do
    # Tesseract vem embutido no instalador (vendor/tesseract, gerado por
    # scripts/build-tesseract.js) com fallback para o do sistema.
    # So requer packaging+Pillow, ja presentes.
    "pytesseract==0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

# O backend e um conjunto de packages top-level vivendo em backend/
# (routes, controllers, services, utils, config). Com `pip install -e .`
# eles passam a ser importaveis de qualquer diretorio (testes da raiz),
# sem alterar os imports existentes nem os pontos de entrada
# (python backend/app.py / Electron / PyInstaller).
[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

# Testes da raiz do repositorio: pythonpath resolve os imports
# absolutos (from services..., from routes...) sem instalacao.
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = [
    "slow: sobe o servidor real como subprocesso (bind/debug/nao-bloqueio)",
]
