<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREMEPE Office</title>
    <!-- CSP do splash: apenas estilo inline e imagem local -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #003d29 0%, #007a51 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
        }

        .splash-container {
            text-align: center;
        }

        .logo {
            max-width: 200px;
            margin-bottom: 30px;
        }

        .spinner {
            display: inline-block;
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message {
            font-size: 1.05rem;
            opacity: 0.95;
            letter-spacing: 0.5px;
        }

        .version {
            margin-top: 28px;
            font-size: 0.75rem;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="splash-container">
        <img src="assets/logo.svg" alt="CREMEPE Office" class="logo" style="max-width:280px;">
        <div class="spinner"></div>
        <div class="message">Iniciando CREMEPE Office...</div>
        <div class="version">v1.0.0</div>
    </div>
</body>

</html>
