<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREMEPE Office</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #007A51;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
            margin: 0;
        }

        .splash-container {
            text-align: center;
        }

        .logo {
            max-width: 200px;
            margin-bottom: 30px;
        }

        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message {
            font-size: 1.2rem;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .version {
            margin-top: 30px;
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="splash-container">
        <!-- Substitua pelo caminho do logo -->
        <img src="assets/logo.svg" alt="CREMEPE Office" class="logo" style="max-width:280px;">
        <div class="spinner"></div>
        <div class="message">Iniciando CREMEPE Office...</div>
        <div class="version">v1.0.0</div>
    </div>
</body>

</html>
