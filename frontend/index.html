<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CREMEPE OFFICE</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Custom CSS (cores e sidebar) -->
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div id="app" class="d-flex vh-100">
        <!-- Sidebar -->
        <aside id="sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-white"
            style="width: 240px; background-color: #007A51;">
            <div class="text-center pb-2">
                <img src="assets/logo.svg" alt="CREMEPE Office" id="sidebar-logo">
            </div>
            <!-- <div id="logo" class="text-center fw-bold fs-4 pb-3 mb-3 border-bottom" style="border-color: #009964;">
                CREMEPE OFFICE
            </div> -->
            <nav class="nav nav-pills flex-column mb-auto gap-1">
                <button class="nav-btn nav-link text-white active" data-page="home">
                    <i class="bi bi-house-door me-2"></i> Home
                </button>
                <button class="nav-btn nav-link text-white" data-page="files">
                    <i class="bi bi-folder2-open me-2"></i> Arquivos e Pastas
                </button>
                <button class="nav-btn nav-link text-white" data-page="pdf">
                    <i class="bi bi-file-earmark-pdf me-2"></i> PDF
                </button>
                <button class="nav-btn nav-link text-white" data-page="word">
                    <i class="bi bi-file-earmark-word me-2"></i> Word
                </button>
                <button class="nav-btn nav-link text-white" data-page="excel">
                    <i class="bi bi-file-earmark-excel me-2"></i> Excel
                </button>
            </nav>
            <hr style="border-color: #009964;" />
            <div class="mt-auto">
                <button class="nav-btn nav-link text-white" data-page="settings">
                    <i class="bi bi-gear me-2"></i> Configurações
                </button>
                <div id="version" class="text-center text-white-50 small mt-2">v1.0.0</div>
            </div>
        </aside>

        <!-- Conteúdo principal -->
        <main id="content" class="flex-grow-1 p-4 overflow-auto bg-white">
            <div id="page-container"></div>
        </main>
    </div>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Bootstrap JS (opcional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts do app -->
    <script src="js/api.js"></script>
    <script src="js/modules/home.js"></script>
    <script src="js/modules/settings.js"></script>
    <!-- PASTAS E ARQUIVOS -->
    <script src="js/modules/file/utils.js"></script>
    <script src="js/modules/file/collect.js"></script>
    <script src="js/modules/file/rename.js"></script>
    <script src="js/modules/file/duplicates.js"></script>
    <script src="js/modules/file/index.js"></script>
    <script src="js/modules/file/organize.js"></script>
    <script src="js/modules/file/rename_by_content.js"></script>
    <script src="js/modules/file/attributes.js"></script>
    <script src="js/modules/file/report.js"></script>
    <script src="js/modules/file/compare.js"></script>
    <script src="js/modules/file/archive.js"></script>
    <script src="js/modules/file/split.js"></script>
    <!-- PDF -->
    <script src="js/modules/pdf/merge.js"></script>
    <script src="js/modules/pdf/merge_by_size.js"></script>
    <script src="js/modules/pdf/split.js"></script>
    <script src="js/modules/pdf/split_by_size.js"></script>
    <script src="js/modules/pdf/extract_pages.js"></script>
    <script src="js/modules/pdf/remove_pages.js"></script>
    <script src="js/modules/pdf/reorder.js"></script>
    <script src="js/modules/pdf/add_page_numbers.js"></script>
    <script src="js/modules/pdf/convert_to_word.js"></script>
    <script src="js/modules/pdf/convert_to_image.js"></script>
    <script src="js/modules/pdf/compress.js"></script>
    <script src="js/modules/pdf/protect.js"></script>
    <script src="js/modules/pdf/index.js"></script>
    <!-- WORD -->
    <script src="js/modules/word/utils.js"></script>
    <script src="js/modules/word/merge.js"></script>
    <script src="js/modules/word/convert.js"></script>
    <script src="js/modules/word/compare.js"></script>
    <script src="js/modules/word/extract_images.js"></script>
    <script src="js/modules/word/watermark.js"></script>
    <script src="js/modules/word/filepath.js"></script>
    <script src="js/modules/word/index.js"></script>
    <!-- EXCEL -->
    <script src="js/modules/excel/utils.js"></script>
    <script src="js/modules/excel/convert.js"></script>
    <script src="js/modules/excel/merge_all.js"></script>
    <script src="js/modules/excel/extract_cells.js"></script>
    <script src="js/modules/excel/split_by_column.js"></script>
    <script src="js/modules/excel/split_sheets.js"></script>
    <script src="js/modules/excel/index.js"></script>
    <!-- APP -->
    <script src="js/app.js"></script>
</body>

</html>
