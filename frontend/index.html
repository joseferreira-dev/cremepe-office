<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CREMEPE Office</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Custom CSS (cores e sidebar) -->
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div id="app" class="d-flex vh-100">
        <!-- Sidebar -->
        <aside id="sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-white"
            style="width: 240px; background-color: #007A51;">
            <div id="logo" class="text-center fw-bold fs-4 pb-3 mb-3 border-bottom" style="border-color: #009964;">
                CREMEPE Office
            </div>
            <nav class="nav nav-pills flex-column mb-auto gap-1">
                <button class="nav-btn nav-link text-white active" data-page="home">
                    <i class="bi bi-house-door me-2"></i> Home
                </button>
                <button class="nav-btn nav-link text-white" data-page="files">
                    <i class="bi bi-folder2-open me-2"></i> Arquivos e Pastas
                </button>
                <button class="nav-btn nav-link text-white" data-page="pdf">
                    <i class="bi bi-file-earmark-pdf me-2"></i> PDF
                </button>
                <button class="nav-btn nav-link text-white" data-page="word">
                    <i class="bi bi-file-earmark-word me-2"></i> Documentos
                </button>
                <button class="nav-btn nav-link text-white" data-page="excel">
                    <i class="bi bi-file-earmark-excel me-2"></i> Planilhas
                </button>
            </nav>
            <hr style="border-color: #009964;" />
            <div class="mt-auto">
                <button class="nav-btn nav-link text-white" data-page="settings">
                    <i class="bi bi-gear me-2"></i> Configurações
                </button>
                <div id="version" class="text-center text-white-50 small mt-2">v0.1.0</div>
            </div>
        </aside>

        <!-- Conteúdo principal -->
        <main id="content" class="flex-grow-1 p-4 overflow-auto bg-white">
            <div id="page-container"></div>
        </main>
    </div>

    <!-- Bootstrap JS (opcional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts do app -->
    <script src="js/api.js"></script>
    <script src="js/modules/file/utils.js"></script>
    <script src="js/modules/file/collect.js"></script>
    <script src="js/modules/file/rename.js"></script>
    <script src="js/modules/file/duplicates.js"></script>
    <script src="js/modules/file/index.js"></script>
    <script src="js/modules/home.js"></script>
    <script src="js/modules/pdf.js"></script>
    <script src="js/modules/word.js"></script>
    <script src="js/modules/excel.js"></script>
    <script src="js/modules/settings.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
