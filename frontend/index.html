<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CREMEPE OFFICE</title>
    <!-- CSP: só recursos locais + API em 127.0.0.1. style-src mantém
         'unsafe-inline' pelos atributos style do markup; script-src é
         'self' (nenhum script inline na página). -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:5000; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">
    <!-- Design system Tailwind (gerar com: npm run build:css) -->
    <link rel="stylesheet" href="css/tailwind.css" />
</head>

<body>
    <div id="app" class="flex h-screen bg-zinc-50">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-brand">
                <img src="assets/logo.svg" alt="CREMEPE Office" id="sidebar-logo">
            </div>
            <nav class="flex flex-col gap-1">
                <button class="nav-btn active" data-page="home">
                    <i data-lucide="house"></i> Home
                </button>
                <button class="nav-btn" data-page="files">
                    <i data-lucide="folder-open"></i> Arquivos e Pastas
                </button>
                <button class="nav-btn" data-page="pdf">
                    <i data-lucide="file-text"></i> PDF
                </button>
                <button class="nav-btn" data-page="word">
                    <i data-lucide="file-pen"></i> Word
                </button>
                <button class="nav-btn" data-page="excel">
                    <i data-lucide="file-spreadsheet"></i> Excel
                </button>
            </nav>
            <div class="mt-auto space-y-2 border-t border-zinc-100 pt-4">
                <!-- Status do Backend -->
                <div id="backend-status">
                    <span id="status-dot"></span>
                    <span id="status-text">Verificando...</span>
                </div>
                <div id="version" class="text-center text-xs text-zinc-400">v1.0.0</div>
            </div>
        </aside>

        <!-- Conteúdo principal -->
        <main id="content" class="grow overflow-auto bg-zinc-50 p-7">
            <div id="page-container"></div>

            <!-- Barra de resultado: preenchida pelo api.ts quando a
                 resposta traz output_path — oferece abrir/copiar o
                 arquivo gerado (antes o caminho só ia para o log e o
                 usuario digitava à mão em outro lugar). -->
            <div id="result-bar" class="mt-4" style="display:none;">
                <div class="card">
                    <div class="card-body">
                        <div class="flex flex-wrap items-center gap-3">
                            <div class="min-w-0 grow">
                                <div class="text-xs font-semibold tracking-wider text-zinc-500 uppercase">Arquivo gerado</div>
                                <div id="result-path" class="truncate text-sm text-zinc-800" title=""></div>
                            </div>
                            <div class="flex shrink-0 flex-wrap gap-2">
                                <button class="btn btn-success btn-sm" id="result-open">
                                    <i data-lucide="external-link"></i> Abrir
                                </button>
                                <button class="btn btn-outline-secondary btn-sm" id="result-copy">
                                    <i data-lucide="copy"></i> Copiar caminho
                                </button>
                                <button class="btn btn-outline-secondary btn-sm" id="result-reveal">
                                    <i data-lucide="folder-open"></i> Na pasta
                                </button>
                                <button class="btn btn-outline-secondary btn-sm" id="result-close" title="Fechar">
                                    <i data-lucide="x"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Ícones Lucide (local) + PDF.js local (script clássico - define o global pdfjsLib) -->
    <script src="vendor/lucide.min.js"></script>
    <script src="vendor/pdf.min.js"></script>
    <!-- App: um único entry point ES module; a ordem de carregamento dos
         ~45 módulos é resolvida pelos imports -->
    <script type="module" src="dist/app.js"></script>
</body>

</html>
