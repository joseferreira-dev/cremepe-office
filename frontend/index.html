<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CREMEPE OFFICE</title>
    <!-- CSP: só recursos locais + API em 127.0.0.1. style-src mantém
         'unsafe-inline' pelos atributos style do markup; script-src é
         'self' (nenhum script inline na página). -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:5000; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">
    <!-- Bootstrap CSS (local — app funciona offline) -->
    <link href="vendor/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons (local) -->
    <link href="vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <!-- Custom CSS (cores e sidebar) -->
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div id="app" class="d-flex vh-100">
        <!-- Sidebar -->
        <aside id="sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-white"
            style="width: 240px; background-color: #007A51;">
            <div class="text-center pb-2">
                <img src="assets/logo.svg" alt="CREMEPE Office" id="sidebar-logo">
            </div>
            <nav class="nav nav-pills flex-column mb-auto gap-1">
                <button class="nav-btn nav-link text-white active" data-page="home">
                    <i class="bi bi-house-door me-2"></i> Home
                </button>
                <button class="nav-btn nav-link text-white" data-page="files">
                    <i class="bi bi-folder2-open me-2"></i> Arquivos e Pastas
                </button>
                <button class="nav-btn nav-link text-white" data-page="pdf">
                    <i class="bi bi-file-earmark-pdf me-2"></i> PDF
                </button>
                <button class="nav-btn nav-link text-white" data-page="word">
                    <i class="bi bi-file-earmark-word me-2"></i> Word
                </button>
                <button class="nav-btn nav-link text-white" data-page="excel">
                    <i class="bi bi-file-earmark-excel me-2"></i> Excel
                </button>
            </nav>
            <hr style="border-color: #009964;" />
            <div class="mt-auto">
                <!-- Status do Backend -->
                <div id="backend-status" class="text-center small mb-2">
                    <span id="status-dot"></span>
                    <span id="status-text">Verificando...</span>
                </div>
                <div id="version" class="text-center text-white-50 small mt-2">v1.0.0</div>
            </div>
        </aside>

        <!-- Conteúdo principal -->
        <main id="content" class="flex-grow-1 p-4 overflow-auto bg-white">
            <div id="page-container"></div>
        </main>
    </div>

    <!-- PDF.js local (script clássico - define o global pdfjsLib) -->
    <script src="vendor/pdf.min.js"></script>
    <!-- Bootstrap JS (local) -->
    <script src="vendor/bootstrap.bundle.min.js"></script>
    <!-- App: um único entry point ES module; a ordem de carregamento dos
         ~45 módulos é resolvida pelos imports -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
